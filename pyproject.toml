[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-data-manager"
version = "0.1.0"
description = "A-share data providers, collection services, schedulers, and database maintenance tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.1",
  "loguru>=0.7",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=17",
  "pytdx>=1.72",
  "redis>=5",
  "requests>=2.31",
  "schedule>=1.2",
  "tushare>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
news-analysis = ["scikit-learn>=1.4"]
graph = ["neo4j>=6.0,<7"]

[project.scripts]
trading-data = "coreClient.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["coreClient*", "offlineDataManager*", "onlineDataManager*", "theme_graph*"]
namespaces = true

[tool.setuptools.package-data]
"coreClient" = ["neo4j_schema.cypher"]
"theme_graph.daily_limitup_graph" = ["schema.sql", "prompts/*.md"]
"theme_graph" = ["prompts/*.md"]
