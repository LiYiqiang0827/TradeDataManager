# Local isolated demo. Supply a private password through the shell, never Git.
services:
  neo4j:
    image: neo4j:2026.09.0-community
    ports:
      - "127.0.0.1:17474:7474"
      - "127.0.0.1:17687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${TRADING_THEME_NEO4J_PASSWORD:?Set a private Neo4j password}"
      NEO4J_server_memory_heap_initial__size: 128m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    volumes:
      - ./.runtime/data:/data
      - ./.runtime/logs:/logs
